name: Deploy Portfolio to AWS Singapore

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: "1.5.0"

      - name: Prepare SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/portfolio-key.pem
          chmod 600 ~/.ssh/portfolio-key.pem
          ssh-keygen -y -f ~/.ssh/portfolio-key.pem > ~/.ssh/portfolio-key.pub

      - name: Create terraform.tfvars
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
          GITHUB_REPO_URL: ${{ secrets.GITHUB_REPO_URL }}
        run: |
          cd terraform
          cat > terraform.tfvars << EOF
aws_region = "$AWS_REGION"
instance_type = "t2.micro"
public_key_path = "~/.ssh/portfolio-key.pub"
github_repo_url = "$GITHUB_REPO_URL"
EOF
          echo "✓ terraform.tfvars created"
          cat terraform.tfvars

      - name: Terraform Init
        working-directory: ./terraform
        run: terraform init

      - name: Terraform Plan
        working-directory: ./terraform
        run: terraform plan -var-file=terraform.tfvars -out=tfplan

      - name: Terraform Apply
        working-directory: ./terraform
        run: terraform apply -auto-approve tfplan

      - name: Get EC2 Public IP
        working-directory: ./terraform
        run: |
          terraform output -raw instance_public_ip > ../public_ip.txt
          cat ../public_ip.txt

      - name: Wait for EC2
        run: |
          PUBLIC_IP=$(cat public_ip.txt)
          echo "Waiting for EC2 at $PUBLIC_IP..."
          timeout 300 bash -c "until ssh -o ConnectTimeout=5 -o StrictHostKeyChecking=no -i ~/.ssh/portfolio-key.pem ubuntu@$PUBLIC_IP 'echo ready' 2>/dev/null; do sleep 10; done" || true

      - name: Deploy Website
        env:
          GITHUB_REPO_URL: ${{ secrets.GITHUB_REPO_URL }}
        run: |
          PUBLIC_IP=$(cat public_ip.txt)
          
          pip install ansible
          
          cat > inventory.ini << EOF
[portfolio]
$PUBLIC_IP ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/portfolio-key.pem
EOF
          
          ansible-playbook -i inventory.ini << 'EOF'
---
- hosts: portfolio
  become: yes
  tasks:
    - name: Update apt
      apt: update_cache=yes
    
    - name: Install nginx git
      apt:
        name: [nginx, git]
        state: present
    
    - name: Create deploy directory
      file:
        path: /var/www/portfolio
        state: directory
        owner: www-data
        group: www-data
        mode: '0755'
    
    - name: Clone portfolio repo
      git:
        repo: "{{ lookup('env', 'GITHUB_REPO_URL') }}"
        dest: /var/www/portfolio
        version: main
      become_user: www-data
    
    - name: Configure nginx
      copy:
        dest: /etc/nginx/sites-available/default
        content: |
          server {
              listen 80 default_server;
              server_name _;
              root /var/www/portfolio;
              index index.html;
              
              location / {
                  try_files $uri $uri/ =404;
              }
              
              location ~* \.(jpg|jpeg|png|gif|ico|css|js)$ {
                  expires 30d;
              }
          }
    
    - name: Enable nginx
      service:
        name: nginx
        state: started
        enabled: yes
EOF

      - name: Verify Deployment
        run: |
          PUBLIC_IP=$(cat public_ip.txt)
          sleep 5
          curl -I http://$PUBLIC_IP/ || exit 1
          echo "✅ Website deployed successfully!"

      - name: Deployment Summary
        if: always()
        run: |
          PUBLIC_IP=$(cat public_ip.txt)
          echo "## ✅ Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🌍 Website URL:" >> $GITHUB_STEP_SUMMARY
          echo "http://$PUBLIC_IP" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📍 Region: Singapore (ap-southeast-1)" >> $GITHUB_STEP_SUMMARY
