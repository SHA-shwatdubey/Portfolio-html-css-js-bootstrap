name: Deploy Portfolio to AWS Singapore

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      # 1. Checkout code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Configure AWS
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # 3. Setup Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: "1.5.0"

      # 4. Prepare SSH Key
      - name: Prepare SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/portfolio-key.pem
          chmod 600 ~/.ssh/portfolio-key.pem
          ssh-keygen -y -f ~/.ssh/portfolio-key.pem > ~/.ssh/portfolio-key.pub
          echo "SSH Key prepared:"
          ls -la ~/.ssh/portfolio-key*

      # 5. Create terraform.tfvars from local template
      - name: Create terraform.tfvars
        run: |
          cd terraform
          # Copy the example and update values
          cp terraform.tfvars.example terraform.tfvars.new || true
          
          # Create fresh tfvars with secrets
          cat > terraform.tfvars << 'EOF'
aws_region = "${{ secrets.AWS_REGION }}"
instance_type = "t2.micro"
public_key_path = "~/.ssh/portfolio-key.pub"
github_repo_url = "${{ secrets.GITHUB_REPO_URL }}"
EOF
          
          echo "✅ terraform.tfvars created:"
          cat terraform.tfvars
          echo ""
          echo "File exists check:"
          test -f terraform.tfvars && echo "✓ FILE EXISTS" || echo "✗ FILE MISSING"

      # 6. Terraform Init
      - name: Terraform Init
        run: |
          cd terraform
          echo "Current directory: $(pwd)"
          echo "Contents:"
          ls -la
          terraform init

      # 7. Terraform Validate
      - name: Terraform Validate
        run: |
          cd terraform
          terraform validate

      # 8. Terraform Plan
      - name: Terraform Plan
        run: |
          cd terraform
          echo "Checking terraform.tfvars..."
          test -f terraform.tfvars || (echo "ERROR: tfvars missing!" && exit 1)
          echo "✓ tfvars found"
          echo "Contents:"
          cat terraform.tfvars
          echo ""
          echo "Running terraform plan..."
          terraform plan -var-file=terraform.tfvars -out=tfplan

      # 9. Terraform Apply
      - name: Terraform Apply
        run: |
          cd terraform
          terraform apply -auto-approve tfplan

      # 10. Get Output IP
      - name: Get EC2 Public IP
        run: |
          cd terraform
          PUBLIC_IP=$(terraform output -raw instance_public_ip)
          echo "$PUBLIC_IP" > ../ec2_ip.txt
          echo "✓ EC2 Public IP: $PUBLIC_IP"

      # 11. Wait for EC2
      - name: Wait for EC2 Ready
        run: |
          PUBLIC_IP=$(cat ec2_ip.txt)
          echo "Waiting for EC2 to be ready at $PUBLIC_IP..."
          timeout 300 bash -c "until ssh -o ConnectTimeout=5 -o StrictHostKeyChecking=no -i ~/.ssh/portfolio-key.pem ubuntu@$PUBLIC_IP 'echo ready' 2>/dev/null; do echo 'Waiting...'; sleep 10; done" || true

      # 12. Deploy Website with Ansible
      - name: Deploy with Ansible
        run: |
          PUBLIC_IP=$(cat ec2_ip.txt)
          
          # Install Ansible
          pip install ansible boto3
          
          # Create inventory
          cat > hosts.ini << EOF
[portfolio]
$PUBLIC_IP ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/portfolio-key.pem
EOF
          
          # Run playbook (simple version)
          ansible-playbook -i hosts.ini -e "repo_url=${{ secrets.GITHUB_REPO_URL }}" -e "deploy_dir=/var/www/portfolio" << 'PLAYBOOK'
---
- hosts: portfolio
  become: yes
  tasks:
    - name: Update apt
      apt: update_cache=yes
    
    - name: Install nginx git curl
      apt:
        name: [nginx, git, curl]
        state: present
    
    - name: Create deploy directory
      file:
        path: /var/www/portfolio
        state: directory
        owner: www-data
        group: www-data
    
    - name: Clone repository
      git:
        repo: "{{ repo_url }}"
        dest: /var/www/portfolio
        version: main
      become_user: www-data
    
    - name: Configure nginx
      copy:
        content: |
          server {
              listen 80 default_server;
              server_name _;
              root /var/www/portfolio;
              index index.html;
              
              location / {
                  try_files $uri $uri/ =404;
              }
              
              location ~* \.(jpg|jpeg|png|gif|ico|css|js)$ {
                  expires 30d;
              }
          }
        dest: /etc/nginx/sites-available/default
      notify: restart nginx
    
    - name: Test nginx config
      shell: nginx -t
    
    - name: Start nginx
      service:
        name: nginx
        state: started
        enabled: yes
    
    handlers:
      - name: restart nginx
        service:
          name: nginx
          state: restarted
PLAYBOOK

      # 13. Verify
      - name: Verify Deployment
        run: |
          PUBLIC_IP=$(cat ec2_ip.txt)
          echo "Testing website at http://$PUBLIC_IP..."
          curl -I http://$PUBLIC_IP/ || exit 1
          echo "✅ Website is live!"

      # 14. Summary
      - name: Deployment Summary
        run: |
          PUBLIC_IP=$(cat ec2_ip.txt)
          echo "## ✅ Deployment Successful!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🌍 Website URL:" >> $GITHUB_STEP_SUMMARY
          echo "http://$PUBLIC_IP" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📍 Region:" >> $GITHUB_STEP_SUMMARY
          echo "Singapore (ap-southeast-1)" >> $GITHUB_STEP_SUMMARY
