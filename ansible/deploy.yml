---
- name: Deploy Portfolio Website
  hosts: portfolio_servers
  become: yes
  gather_facts: yes

  vars:
    repo_url: "{{ github_repo_url }}"
    deploy_dir: /var/www/portfolio
    nginx_config_dir: /etc/nginx/sites-available

  tasks:
    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Install required packages
      apt:
        name:
          - nginx
          - git
          - curl
          - wget
        state: present

    - name: Create deployment directory
      file:
        path: "{{ deploy_dir }}"
        state: directory
        mode: '0755'

    - name: Clone or update repository
      git:
        repo: "{{ repo_url }}"
        dest: "{{ deploy_dir }}"
        version: main
        force: yes

    - name: Remove default Nginx config
      file:
        path: "{{ nginx_config_dir }}/default"
        state: absent

    - name: Create Nginx configuration
      template:
        src: nginx.conf.j2
        dest: "{{ nginx_config_dir }}/portfolio"
        owner: root
        group: root
        mode: '0644'

    - name: Enable Nginx site
      file:
        src: "{{ nginx_config_dir }}/portfolio"
        dest: /etc/nginx/sites-enabled/portfolio
        state: link

    - name: Test Nginx configuration
      command: nginx -t
      register: nginx_test
      changed_when: false

    - name: Start and enable Nginx
      systemd:
        name: nginx
        state: started
        enabled: yes
        daemon_reload: yes

    - name: Reload Nginx after configuration
      systemd:
        name: nginx
        state: reloaded

    - name: Verify deployment
      uri:
        url: "http://localhost/"
        status_code: 200
      retries: 3
      delay: 5

    - name: Deployment complete
      debug:
        msg: "Portfolio website deployed successfully!"
